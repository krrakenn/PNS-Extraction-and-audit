name: Daily Audit Pipeline

on:
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-daily-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Auditor/requirements.txt
        pip install python-dotenv langfuse pandas requests

    # ── Step 1: Pull today's 100 calls from Redash ─────────────────────────────
    # Outputs: csv_batch_tool/input/daily_input.csv
    # Columns: FILE_ID, llm_extracted_json, RECORDING_URL, RECEIVER_GLID, SENDER_GLID
    - name: Fetch Daily Calls from Redash
      run: python fetch_redash.py
      env:
        REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}

    # ── Step 2: Normalize Flash JSON from Redash into auditor-ready CSV ────────
    # Uses llm_extracted_json column from daily_input.csv
    - name: Normalize Flash Data
      run: |
        python Auditor/import_flash_data.py \
          --source-csv csv_batch_tool/input/daily_input.csv \
          --output-csv csv_batch_tool/input/daily_flash_normalized.csv

    # ── Step 3: Run Go extraction (Gemini 2.5 Pro) on audio URLs ───────────────
    # Uses RECORDING_URL, SENDER_GLID, RECEIVER_GLID from daily_input.csv
    - name: Run Extraction (Pro)
      run: python run_pipeline.py --step extract
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LANGFUSE_PUBLIC_KEY: ${{ secrets.EXTRACT_LANGFUSE_PUBLIC_KEY }}
        LANGFUSE_SECRET_KEY: ${{ secrets.EXTRACT_LANGFUSE_SECRET_KEY }}
        LANGFUSE_BASE_URL: "https://cloud.langfuse.com"
        PNS_INPUT_CSV: "csv_batch_tool/input/daily_input.csv"

    # ── Step 4: Run Audits comparing Pro output vs normalized Flash ─────────────
    - name: Run Audits
      run: |
        python run_pipeline.py --step audit \
          --flash-csv csv_batch_tool/input/daily_flash_normalized.csv
      env:
        IMLLM_API_KEY: ${{ secrets.IMLLM_API_KEY }}
        LANGFUSE_PUBLIC_KEY: ${{ secrets.AUDIT_LANGFUSE_PUBLIC_KEY }}
        LANGFUSE_SECRET_KEY: ${{ secrets.AUDIT_LANGFUSE_SECRET_KEY }}
        LANGFUSE_HOST: "https://langfuse.intermesh.net"

    # ── Step 5: Collate and analyze results ────────────────────────────────────
    - name: Collate and Analyze
      run: |
        python run_pipeline.py --step collate
        python run_pipeline.py --step analyze

    # ── Step 6: Upload summary to Google Sheets ────────────────────────────────
    - name: Upload Results to Google Sheets
      run: python Auditor/upload_to_sheets.py
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
